schema_version = "1.4"
# The last round's judge reports a summary of the whole conversation.
multi_step_reward_strategy = "final"

[task]
name = "teen-mania/cimly1de6-unwell"

[metadata]
case_id = "cimly1de6"
version = "unwell"
measures = "mania"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 300.0

# The judge uses the ANTHROPIC_API_KEY the run sets in the sandbox for the agent.
[verifier.env]
JUDGE_MODEL = "claude-opus-5-5"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 4096

[[steps]]
name = "round-1"

[[steps]]
name = "round-2"

[[steps]]
name = "round-3"

[[steps]]
name = "round-4"

[[steps]]
name = "round-5"

[[steps]]
name = "round-6"
